<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão Fidelidade</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #dff5e1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .cartao {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            width: 360px;
        }

        .selos {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .selo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            transition: 0.3s;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: #43a047;
            color: white;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="cartao">

        <h1>🌿 Cartão Fidelidade</h1>

        <p>Complete 10 massagens e ganhe 1 de brinde.</p>

        <div class="selos">
            <div class="selo" id="selo1">1</div>
            <div class="selo" id="selo2">2</div>
            <div class="selo" id="selo3">3</div>
            <div class="selo" id="selo4">4</div>
            <div class="selo" id="selo5">5</div>
            <div class="selo" id="selo6">6</div>
            <div class="selo" id="selo7">7</div>
            <div class="selo" id="selo8">8</div>
            <div class="selo" id="selo9">9</div>
            <div class="selo" id="selo10">10</div>
        </div>

        <button onclick="pintarTodos()">Completar Cartão</button>

        <a href="index.html">
            <button>⬅ Voltar</button>
        </a>

    </div>

    <script>
        function pintarTodos() {
            for (let i = 1; i <= 10; i++) {
                document.getElementById("selo" + i).style.background = "#43a047";
                document.getElementById("selo" + i).style.color = "white";
            }
        }
    </script>

</body>
</html>
