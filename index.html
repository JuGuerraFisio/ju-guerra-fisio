<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ju Guerra Fisio</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #dff5e1;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .cartao {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      text-align: center;
      width: 320px;
    }

    h1 {
      color: #2e7d32;
      margin-top: 0;
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      text-align: center;
    }

    .selos {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin: 20px 0;
    }

    .selo {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 20px;
      transition: 0.2s;
    }

    .selo.ativo {
      background: #4caf50;
      color: white;
    }

    button {
      margin-top: 10px;
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      background: #2e7d32;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #256628;
    }
  </style>
</head>

<body>

<div class="cartao">
  <h1>🌿 Ju Guerra Fisio</h1>

  <label>Nome do cliente:</label><br>
  <input type="text" id="nomeCliente" placeholder="Digite o nome" oninput="atualizarCliente()">

  <p>Cliente: <span id="mostrarCliente">__________</span></p>

  <p>
    A cada <strong>10 Quick Massagens</strong>,
    ganhe <strong>1 de brinde.</strong>
  </p>

  <div class="selos" id="selos"></div>

  <button onclick="completarCartao()">Completar Cartão</button>
  <br>
  <button onclick="registrarMassagem()">Registrar Massagem</button>
</div>

<script>
  let totalSelos = 10;
  let selosAtivos = JSON.parse(localStorage.getItem("selos")) || Array(totalSelos).fill(false);

  function criarSelos() {
    const container = document.getElementById("selos");
    container.innerHTML = "";

    selosAtivos.forEach((ativo, index) => {
      const selo = document.createElement("div");
      selo.className = "selo" + (ativo ? " ativo" : "");
      selo.innerHTML = ativo ? "✓" : "";

      selo.onclick = () => {
        selosAtivos[index] = !selosAtivos[index];
        localStorage.setItem("selos", JSON.stringify(selosAtivos));
        criarSelos();
      };

      container.appendChild(selo);
    });
  }

  function registrarMassagem() {
    const index = selosAtivos.findIndex(s => !s);

    if (index !== -1) {
      selosAtivos[index] = true;
      localStorage.setItem("selos", JSON.stringify(selosAtivos));
      criarSelos();

      if (selosAtivos.every(s => s)) {
        alert("🎉 Cartão completo! Cliente ganhou 1 Quick Massagem de brinde!");
      } else {
        alert("💆 Quick Massagem registrada!");
      }
    } else {
      alert("🎉 O cartão já está completo!");
    }
  }

  function completarCartao() {
    selosAtivos = Array(totalSelos).fill(true);
    localStorage.setItem("selos", JSON.stringify(selosAtivos));
    criarSelos();
  }

  function atualizarCliente() {
    const nome = document.getElementById("nomeCliente").value;
    document.getElementById("mostrarCliente").innerText = nome;
    localStorage.setItem("cliente", nome);
  }

  window.onload = function () {
    criarSelos();

    const nomeSalvo = localStorage.getItem("cliente");
    if (nomeSalvo) {
      document.getElementById("nomeCliente").value = nomeSalvo;
      document.getElementById("mostrarCliente").innerText = nomeSalvo;
    }
  };
</script>

</body>
</html>
